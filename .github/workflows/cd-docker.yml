name: CD - Publish Docker Images

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'services/api/**'
      - 'server/**'
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd-docker.yml'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      service:
        description: 'Service image to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - image-server
          - web

permissions: {}

concurrency:
  group: cd-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-services:
    name: Select target images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Determine image matrix
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SERVICE: ${{ inputs.service || 'all' }}
        run: |
          set -euo pipefail
          case "$SELECTED_SERVICE" in
            api)
              MATRIX='[{"name":"api","context":"./services/api"}]'
              ;;
            image-server)
              MATRIX='[{"name":"image-server","context":"./server"}]'
              ;;
            web)
              MATRIX='[{"name":"web","context":"./web"}]'
              ;;
            *)
              MATRIX='[{"name":"api","context":"./services/api"},{"name":"image-server","context":"./server"},{"name":"web","context":"./web"}]'
              ;;
          esac
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }} to GHCR
    runs-on: ubuntu-latest
    needs: select-services
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select-services.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/shawarmas-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cd-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=cd-${{ matrix.name }}
