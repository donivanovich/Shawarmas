map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    charset utf-8;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Internal health endpoint used by Docker Compose healthcheck
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Normalize bare /cdn path
    location = /cdn {
        return 308 /cdn/;
    }

    # Block internal image-server management and health endpoints from public CDN access
    location ^~ /cdn/api/ {
        return 404;
    }

    location = /cdn/health {
        return 404;
    }

    # Public CDN: strip /cdn/ prefix before proxying to image-server:3000
    # Example: /cdn/products/item.png -> http://image-server:3000/products/item.png
    location /cdn/ {
        proxy_pass http://image-server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;

        # Preserve Cache-Control, ETag, and Last-Modified headers from image-server
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
    }

    # Web storefront (PHP / Apache)
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }
}
