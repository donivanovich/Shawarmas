services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./db/.env
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - shawarmas-db:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file:
      - ./db/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: shawarmas
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html:ro

volumes:
  shawarmas-db:
