services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./db/.env
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - shawarmas-db:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrate-api-sessions.sql:/docker-entrypoint-initdb.d/02-api-sessions.sql:ro
      - ./db/create-api-user.sh:/docker-entrypoint-initdb.d/03-create-api-user.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      image-server:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:3001/api/v1
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/var/www/html:ro

  image-server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: ${IMAGE_SERVER_PORT:-3000}
      IMAGE_STORAGE_PATH: /app/storage
    ports:
      - "127.0.0.1:${IMAGE_SERVER_PORT:-3000}:${IMAGE_SERVER_PORT:-3000}"
    volumes:
      - shawarmas-images:/app/storage
      - ./server/storage/brand:/app/storage/brand:ro
      - ./server/storage/colors:/app/storage/colors:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      IMAGE_SERVER_URL: http://image-server:3000
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      image-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  shawarmas-db:
  shawarmas-images:
