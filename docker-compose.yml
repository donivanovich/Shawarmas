services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./db/.env
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - shawarmas-db:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file:
      - ./db/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: shawarmas
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html:ro

  image-server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: ${IMAGE_SERVER_PORT:-3000}
      IMAGE_STORAGE_PATH: /app/storage
    ports:
      - "${IMAGE_SERVER_PORT:-3000}:${IMAGE_SERVER_PORT:-3000}"
    volumes:
      - shawarmas-images:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shawarmas-db:
  shawarmas-images:
